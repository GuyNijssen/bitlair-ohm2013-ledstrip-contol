# /etc/dnsmasq.d/poles.conf — DHCP for the poles on eth0, nothing else.
interface=eth0
bind-interfaces
# DHCP only: no DNS server.
port=0
dhcp-range=192.168.89.2,192.168.89.50,255.255.255.0,12h
# Poles need no gateway or DNS.
dhcp-option=3
dhcp-option=6
dhcp-authoritative
log-dhcp

# Fix pole order: one line per pole, MAC from the leases
# (cat /var/lib/misc/dnsmasq.leases). Universe = last octet - 1.
#dhcp-host=70:69:69:2d:30:31,192.168.89.2,pole01
